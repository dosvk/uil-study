<title>Chess Puzzle</title>
<style>
:root{--bg:#0f1115;--card:#1b1e26;--card2:#232834;--fg:#f2f3f5;--sub:#aab0bb;--accent:#5b8def;--ok:#2e8c4f;--bad:#b23b3b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",system-ui,sans-serif;}
#app{height:100dvh;display:flex;flex-direction:column;}
header{padding:11px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a2e38;}
header a{color:var(--sub);text-decoration:none;font-size:18px;}
header .t{font-size:15px;font-weight:800;}
.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid #2a2e38;}
.tab{flex:1;text-align:center;padding:9px 6px;border-radius:10px;background:var(--card);color:var(--fg);font-size:13px;border:1px solid #2a2e38;}
.tab.on{background:var(--accent);border-color:var(--accent);}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;}
.pad{padding:16px;max-width:560px;margin:0 auto;}
h2{font-size:18px;color:#8fb0f5;margin:4px 0 10px;}
h3{font-size:15px;margin:18px 0 6px;}
p,li{line-height:1.55;font-size:14.5px;}
ul{padding-left:20px;margin:6px 0;}
.tip{background:#161b26;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:11px 14px;margin:14px 0;font-size:14px;}
table.v{border-collapse:collapse;margin:8px 0;}
table.v td{padding:5px 14px;border-bottom:1px solid #2a2e38;font-size:15px;}
.board{display:grid;grid-template-columns:18px repeat(8,1fr);width:100%;max-width:400px;margin:8px auto;user-select:none;}
.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(9vw,38px);line-height:1;}
.l{background:#e9d7b4;}.d{background:#b58863;}
.sq .w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000;}
.sq .b{color:#111;}
.coord{font-size:11px;color:var(--sub);display:flex;align-items:center;justify-content:center;}
.q{font-weight:700;font-size:15.5px;margin:10px 0 4px;}
.turn{font-size:13px;color:var(--sub);text-align:center;}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:12px 14px;border-radius:11px;border:1px solid #2a2e38;background:var(--card);color:var(--fg);font-size:15px;}
.opt.ok{background:var(--ok);border-color:var(--ok);}
.opt.bad{background:var(--bad);border-color:var(--bad);}
.why{font-size:13.5px;color:#9fd6b2;margin:8px 0;}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid #2a2e38;}
.bar button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:700;}
.bar .s{font-size:14px;color:var(--sub);}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.chip{padding:7px 11px;border-radius:20px;border:1px solid #2a2e38;background:var(--card);color:var(--fg);font-size:13px;}
.chip.on{background:var(--accent);border-color:var(--accent);}
.big{font-size:44px;font-weight:800;text-align:center;margin:10px 0;color:#8fb0f5;}
input.sqin{width:100%;font-size:22px;padding:12px;border-radius:11px;border:1px solid #2a2e38;background:var(--card);color:var(--fg);text-align:center;text-transform:lowercase;}
.hl{outline:4px solid #e0a800;outline-offset:-4px;}

function board(fen,hl){
  let h='',rows=fen.split('/');
  for(let r=0;r<8;r++){
    h+='<div class="coord">'+(8-r)+'</div>';
    let f=0;
    for(const c of rows[r]){
      if(/\d/.test(c)){for(let i=0;i<+c;i++){h+=cell(r,f,'');f++;}}
      else{h+=cell(r,f,'<span class="'+(c===c.toUpperCase()?'w':'b')+'">'+G[c.toUpperCase()]+'</span>');f++;}
    }
  }
  h+='<div></div>';for(const f of 'abcdefgh')h+='<div class="coord">'+f+'</div>';
  return '<div class="board">'+h+'</div>';
  function cell(r,f,inner){const n='abcdefgh'[f]+(8-r);return '<div class="sq '+((r+f)%2?'d':'l')+(hl===n?' hl':'')+'">'+inner+'</div>';}
}
const LEARN=`<div class="pad">
<h2>How the contest works</h2>
<ul>
<li><strong>30-minute paper test</strong> with <strong>20 chess diagrams</strong>, each with 4 answer choices (a-d).</li>
<li>Then a separate <strong>5-minute tiebreaker</strong> of 8 questions.</li>
<li><strong>+1 for each right answer. No penalty for wrong answers</strong>, so never leave one blank. Guess if you have to.</li>
<li>Grades 4 and 5 take the same test. It is not a game against a person. You solve diagrams on paper.</li>
</ul>
<div class="tip">The Texas Tech Chess team writes the test. Their study guide lists the 7 things below. Every question on the sample test is one of these.</div>
<h3>1. Read chess moves (algebraic notation)</h3>
<p>Columns are letters <strong>a-h</strong> (left to right from White's side). Rows are numbers <strong>1-8</strong> (White starts on 1 and 2). Every square has an address like <strong>e4</strong>.</p>
<ul><li>Pieces: <strong>K</strong> king, <strong>Q</strong> queen, <strong>R</strong> rook, <strong>B</strong> bishop, <strong>N</strong> knight. Pawns have no letter.</li>
<li><strong>Nf3</strong> = knight moves to f3. <strong>e4</strong> = pawn moves to e4.</li>
<li><strong>x</strong> = captures. <strong>Bxc6</strong> = bishop captures on c6. <strong>exd5</strong> = the e-pawn captures on d5.</li>
<li><strong>+</strong> = check. <strong>#</strong> = checkmate. <strong>O-O</strong> = short castle. <strong>O-O-O</strong> = long castle.</li></ul>
<p>Practice reading squares in the <strong>Squares</strong> tab.</p>
<h3>2. Know every move, including the special ones</h3>
<ul><li><strong>Castling:</strong> king moves 2 squares toward a rook, and the rook jumps over to the other side. Not allowed if the king or that rook has moved before, if anything is in between, if the king is in check, or if the king would pass through or land on an attacked square.</li>
<li><strong>Promotion:</strong> a pawn that reaches the far row becomes a queen, rook, bishop or knight (never a king). You can have two queens.</li>
<li><strong>En passant:</strong> if an enemy pawn jumps 2 squares and lands right beside your pawn, your pawn can capture it as if it had moved only 1 square. You must do it on the very next move or lose the chance.</li></ul>
<h3>3. Check vs checkmate vs stalemate</h3>
<ul><li><strong>Check:</strong> the king is attacked but can get away (move, block, or capture).</li>
<li><strong>Checkmate:</strong> the king is attacked and cannot get away. Game over.</li>
<li><strong>Stalemate:</strong> the king is NOT attacked, but that side has no legal move. The game is a <strong>draw</strong>.</li></ul>
<h3>4. Piece points (who is ahead?)</h3>
<table class="v"><tr><td>Queen</td><td><strong>9</strong></td></tr><tr><td>Rook</td><td><strong>5</strong></td></tr><tr><td>Bishop</td><td><strong>3</strong></td></tr><tr><td>Knight</td><td><strong>3</strong></td></tr><tr><td>Pawn</td><td><strong>1</strong></td></tr><tr><td>King</td><td>no points</td></tr></table>
<p>Add up each side. The bigger total is ahead. Who is to move does not matter for this question.</p>
<h3>5. Rule of the square</h3>
<p>Can a king catch a pawn racing to promote? Draw an imaginary square from the pawn to its promotion row (the pawn's distance to the end is the side length). If the king can step into that square on its move, it catches the pawn.</p>
<h3>6. Basic tactics</h3>
<ul><li><strong>Fork (double attack):</strong> one piece attacks two things at once. Knights are great at this.</li>
<li><strong>Pin:</strong> a piece can't move because a more valuable piece (often the king) is behind it.</li>
<li><strong>Skewer:</strong> like a pin backwards. The valuable piece is in front, has to move, and the piece behind it gets taken.</li>
<li><strong>En prise:</strong> a piece that is attacked and not defended. Free to take.</li></ul>
<h3>7. "Best play"</h3>
<p>"Can White win with best play?" means both sides make their best moves. If the answer is yes, Black has no escape.</p>
<h3>Test-day habits</h3>
<ul><li>Check whose move it is first. It is written under every diagram.</li>
<li>For "mate in 1" questions, look at checks first: every checkmate is a check.</li>
<li>For mate questions, ask: can the king move? Can the check be blocked? Can the checking piece be captured? All three must be no.</li>
<li>"None of the above" and "can't tell" are sometimes right. Don't skip them.</li></ul>
