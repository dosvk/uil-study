<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Ready Writing</title>
<style>
:root{--bg:#0f1115;--card:#1b1e26;--card2:#232834;--fg:#f2f3f5;--sub:#aab0bb;--accent:#5b8def;--gold:#e0a800;--ok:#2e8c4f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",system-ui,sans-serif;}
#app{height:100dvh;display:flex;flex-direction:column;}
header{padding:11px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a2e38;}
header a{color:var(--sub);text-decoration:none;font-size:18px;}
header .t{font-size:15px;font-weight:800;}
.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid #2a2e38;overflow-x:auto;}
.tab{flex:1 0 auto;white-space:nowrap;text-align:center;padding:9px 12px;border-radius:10px;background:var(--card);color:var(--fg);font-size:13px;border:1px solid #2a2e38;}
.tab.on{background:var(--accent);border-color:var(--accent);}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;}
.pad{padding:16px;max-width:620px;margin:0 auto;}
h2{font-size:18px;color:#8fb0f5;margin:4px 0 10px;}
h3{font-size:15px;margin:16px 0 6px;}
p{margin:8px 0;line-height:1.55;font-size:14.5px;}
ul,ol{margin:8px 0;padding-left:20px;}
li{margin:5px 0;line-height:1.5;font-size:14.5px;}
strong{color:#fff;}
.rubric{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.rbar{background:var(--card);border:1px solid #2a2e38;border-radius:12px;padding:12px 14px;}
.rbar .pct{font-size:22px;font-weight:800;color:var(--accent);}
.rbar.g2 .pct{color:#7f9bd6;} .rbar.g3 .pct{color:#8a909b;}
.rbar .lab{font-weight:700;margin-top:2px;}
.rbar .desc{font-size:13px;color:var(--sub);margin-top:3px;}
.rbar .kid{font-size:12.5px;color:#9fd6b2;font-style:italic;margin-top:5px;}
.tip{background:#161b26;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:11px 14px;margin:14px 0;font-size:14px;color:#dfe4ec;}
.step{background:var(--card);border:1px solid #2a2e38;border-radius:12px;padding:12px 14px;margin:10px 0;}
.step .n{display:inline-block;background:var(--accent);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-weight:700;font-size:13px;margin-right:8px;}
.ex{background:var(--card);border:1px solid #2a2e38;border-radius:12px;padding:14px;margin:12px 0;}
.ex .title{font-weight:800;font-size:16px;}
.ex .essay{font-size:13.5px;line-height:1.55;color:#dfe4ec;white-space:pre-wrap;margin:8px 0;}
.ex .why{font-size:12.5px;color:#9fd6b2;border-top:1px solid #2a2e38;padding-top:8px;}
/* practice */
.promptcard{background:var(--card);border:1px solid #2a2e38;border-radius:12px;padding:13px 14px;margin:9px 0;}
.promptcard .pt{font-weight:700;}
.promptcard .pd{font-size:13.5px;color:var(--sub);margin-top:3px;}
.promptcard button{margin-top:9px;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:700;}
.timerbar{position:sticky;top:0;background:#0f1115ee;backdrop-filter:blur(6px);padding:10px 14px;border-bottom:1px solid #2a2e38;display:flex;align-items:center;justify-content:space-between;}
.timerbar .clock{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.timerbar button{background:var(--card2);color:var(--fg);border:1px solid #2a2e38;border-radius:8px;padding:7px 12px;font-size:13px;}
.plan label{display:block;font-size:12px;color:var(--sub);margin:12px 0 3px;}
.plan input,.plan textarea{width:100%;background:#0c0e13;color:var(--fg);border:1px solid #2a2e38;border-radius:9px;padding:11px;font-size:15px;font-family:inherit;}
.plan textarea{min-height:60px;resize:vertical;}
.chk{list-style:none;padding-left:0;}
.chk li{display:flex;gap:8px;align-items:flex-start;}
.chk input{margin-top:3px;}
.backbtn{background:var(--card2);color:var(--fg);border:1px solid #2a2e38;border-radius:9px;padding:9px 14px;font-size:14px;margin-top:4px;}
</style></head><body>
<div id="app">
  <header><a href="../">&#8249;</a><div class="t">Ready Writing</div></header>
  <div class="tabs">
    <div class="tab on" data-m="learn">Learn</div>
    <div class="tab" data-m="routine">Routine</div>
    <div class="tab" data-m="examples">Examples</div>
    <div class="tab" data-m="practice">Practice</div>
  </div>
  <main id="main"></main>
</div>
<script>
const PROMPTS=[
 {t:"Dream Vacation",d:"Think about your dream vacation. Write an essay explaining why you would like to go to that destination.",type:"Real 2025-26 contest (Fall District)"},
 {t:"Free Time",d:"Imagine you had one more day a week with no school. Write an essay explaining what you would do with your extra free time.",type:"Real 2025-26 contest (Fall District)"},
 {t:"Life at the Zoo",d:"Imagine what the day in the life of a zookeeper is like. Write an essay explaining his or her daily life being as creative as you would like.",type:"Real 2025-26 contest (Invitational)"},
 {t:"Chores",d:"While kids sometimes complain about chores, most have a favorite household task. Write a paper describing what your favorite household chore is and why.",type:"Real 2025-26 contest (Invitational)"},
 {t:"Homework (letter)",d:"Your teachers are deciding how much homework they should give you each week and which skills you should practice. Write a letter to your teachers letting them know what you would like them to decide. Remember not to include your real name or the name of your school.",type:"Real 2025-26 contest (Spring District)"},
 {t:"New Sport",d:"Athletes have to train to become good at their sports. Write an essay describing a sport you would love to learn to play.",type:"Real 2025-26 contest (Spring District)"},
 {t:"Careers",d:"Write about the job you'd like to have when you grow up and why it would be interesting.",type:"Describe / opinion"},
 {t:"Watching TV",d:"Write a LETTER to your parents about how much TV you should watch each week and which shows.",type:"Persuade (letter)"},
 {t:"And the best part is\u2026",d:"Write about what you like best about school and why.",type:"Describe / opinion"},
 {t:"Friends are like stars",d:"\u201CFriends are like stars. You can't always see them, but you know they're there.\u201D Explain why good friends are important.",type:"Opinion"},
 {t:"Unusual Pets",d:"Write about an unusual pet (no cats or dogs) you'd like to own and how you'd take care of it.",type:"Describe"},
 {t:"Homework",d:"\u201CPractice makes perfect.\u201D Write about your experiences with homework.",type:"Describe / opinion"},
 {t:"A perfect day",d:"Describe your perfect Saturday from morning to night.",type:"Describe"},
 {t:"A new holiday",d:"If you could invent a brand-new holiday, what would it celebrate and how?",type:"Describe / invent"},
 {t:"Helping out",d:"Write about a time you helped someone and how it made you feel.",type:"Narrate"},
 {t:"Best invention",d:"What everyday invention is the most useful, and why?",type:"Opinion"},
 {t:"Letter to the principal",d:"Persuade your principal to add one new thing to your school (a club, a trip, a lunch item) and explain why.",type:"Persuade (letter)"},
 {t:"My favorite place",d:"Describe a place that makes you happy so the reader can picture it.",type:"Describe"},
];
const EXAMPLES=[
 {title:"My Pet Otter, Splash", topic:"Unusual Pets",
  essay:`If I could have any unusual pet, I would pick a river otter and name him Splash. Most kids have cats or dogs, but an otter would be the most fun pet on my whole street.

First, Splash would need a big water tank, because otters love to swim and even sleep floating on their backs. I would build him a pool with a little slide, since otters slide down muddy hills for fun. Every morning I would toss in fish, because otters eat about twenty fish a day.

Taking care of Splash would be a lot of work, but I wouldn't mind. Otters are smart, so I could teach him tricks like stacking cups. I would clean his pool every week so the water stayed fresh.

The best part would be our mornings together. I imagine Splash splashing me with his tail while I laugh and get soaked before school. An otter isn't a normal pet, and that is exactly why I would love one.`,
  why:"Why it works: a specific, original choice + real otter facts (Interest, 50%). One idea per paragraph and a closing that circles back (Organization). Clean sentences (Correctness)."},
 {title:"A Letter About TV Time", topic:"Watching TV (a letter)",
  essay:`Dear Mom and Dad,

I want to talk about how much TV I should watch each week. I think one hour on school nights and two hours on weekends would be fair, and here is why.

First, a TV limit helps me get my homework and reading done. If I know I only have one hour, I finish my work faster so I don't miss my show. That way TV is a reward, not a problem.

Second, I would pick shows that teach me something, like nature or science shows. Last week I watched a show about octopuses and learned they have three hearts. Good shows can actually help me learn.

I know too much TV isn't good for me, so I promise to turn it off when my time is up. I hope you think my plan is fair. Thank you for listening.

Love,
Your kid`,
  why:"Why it works: it followed the exact format (a real letter). A specific example (octopus, three hearts) makes it memorable. It argues one side with reasons \u2014 exactly what a persuasive prompt wants."},
];
const main=document.getElementById("main");
let mode="learn", timer=null, secs=0;

function learn(){return `<div class="pad">
 <h2>What happens at the contest</h2>
 <p>You get <strong>two topics</strong> and pick the <strong>one</strong> you like best, then write <strong>one paper by hand</strong>. The topic tells you what to write and sometimes who it's for (like \u201Ca letter to your parents\u201D).</p>
 <ul>
   <li><strong>Time:</strong> about <strong>30\u201345 minutes</strong> at this grade.</li>
   <li><strong>Length:</strong> no required length. Clear beats long.</li>
   <li><strong>Allowed:</strong> a dictionary or thesaurus.</li>
   <li><strong>Must-dos:</strong> put the topic title at the top; never write your name or school.</li>
 </ul>
 <h2>How it's scored \u2014 the secret</h2>
 <div class="rubric">
   <div class="rbar"><div class="pct">50%</div><div class="lab">Interest</div><div class="desc">Fun, original ideas. Real examples. A good title.</div><div class="kid">Be interesting. Use real details.</div></div>
   <div class="rbar g2"><div class="pct">35%</div><div class="lab">Organization</div><div class="desc">A clear point, one idea per paragraph, beginning\u2013middle\u2013end.</div><div class="kid">Stay on topic. Keep it in order.</div></div>
   <div class="rbar g3"><div class="pct">15%</div><div class="lab">Correctness</div><div class="desc">Spelling, grammar, punctuation.</div><div class="kid">Be neat \u2014 but this counts least.</div></div>
 </div>
 <div class="tip"><strong>Biggest tip:</strong> being interesting with <strong>real, specific examples</strong> matters MORE than perfect spelling. Half the score is just good ideas. Never freeze on a hard word \u2014 keep the idea going.</div>
</div>`;}

function routine(){return `<div class="pad">
 <h2>The writing routine</h2>
 <p>One habit to remember: <strong>PLAN \u2192 WRITE \u2192 CHECK</strong></p>
 <div class="step"><span class="n">1</span><strong>PLAN</strong> (about 5 min)<br>Read both topics, pick the one you can tell a <strong>real story</strong> about. Jot: your main idea in one sentence, 3 reasons/details, and 1 real example.</div>
 <div class="step"><span class="n">2</span><strong>WRITE</strong> (most of the time)
   <ul><li><strong>Title</strong> \u2014 make it fun (it's scored!)</li>
   <li><strong>Beginning:</strong> grab attention + say your main idea.</li>
   <li><strong>Middle:</strong> 2\u20133 paragraphs, one idea each, with a real example.</li>
   <li><strong>Ending:</strong> say your main idea a new way; finish strong.</li></ul></div>
 <div class="step"><span class="n">3</span><strong>CHECK</strong> (last 3\u20135 min)<br>Read once for sense, once for capitals/periods/spelling. Did I answer the exact topic? If it asked for a letter, did I start \u201CDear ___\u201D?</div>
 <h3>Five things that win points</h3>
 <ul>
  <li>Do <strong>exactly</strong> what the topic asks.</li>
  <li>Use <strong>real, specific details</strong>, not general ones.</li>
  <li>One idea per paragraph.</li>
  <li>Fun title + strong last sentence.</li>
  <li>Save a few minutes to read it over.</li>
 </ul>
 <div class="tip">Handy connecting words: First, Next, Another reason, For example, Best of all, In the end.</div>
</div>`;}

function examples(){
 return `<div class="pad"><h2>See what \u201Cgood\u201D looks like</h2>
  <p>Read each one, then the note on why it works. Don't copy \u2014 notice the shape and the specific details.</p>`+
  EXAMPLES.map(e=>`<div class="ex"><div class="title">${e.title}</div>
   <div style="font-size:12px;color:var(--sub)">Topic: ${e.topic}</div>
   <div class="essay">${e.essay}</div><div class="why">${e.why}</div></div>`).join("")+`</div>`;
}

function practiceList(){
 return `<div class="pad"><h2>Practice</h2>
  <p>Pick a prompt. You'll get a planning box, a timer, and a self-check \u2014 just like the real thing.</p>`+
  PROMPTS.map((p,i)=>`<div class="promptcard"><div class="pt">${p.t}</div><div class="pd">${p.d}</div>
   <div style="font-size:11px;color:#8a909b;margin-top:4px">${p.type}</div>
   <button data-i="${i}">Practice this</button></div>`).join("")+`</div>`;
}

function fmt(s){const m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0");}
function practiceOne(i){
 const p=PROMPTS[i]; secs=0;
 main.innerHTML=`<div class="timerbar"><div class="clock" id="clk">0:00</div>
    <div><button id="toggle">Start</button> <button id="back">\u2039 Prompts</button></div></div>
  <div class="pad">
   <h3>${p.t}</h3><p>${p.d}</p>
   <div class="plan">
     <label>My title (make it fun)</label><input id="f_title">
     <label>My main idea (one sentence)</label><input id="f_main">
     <label>Reason / detail 1 + a real example</label><textarea id="f1"></textarea>
     <label>Reason / detail 2 + a real example</label><textarea id="f2"></textarea>
     <label>Reason / detail 3 + a real example</label><textarea id="f3"></textarea>
     <label>How I'll finish strong</label><input id="f_end">
   </div>
   <h3>Then write your paper on real paper, and check:</h3>
   <ul class="chk">
     <li><input type="checkbox"> I answered the exact topic (right format?)</li>
     <li><input type="checkbox"> One idea per paragraph, in order</li>
     <li><input type="checkbox"> At least one real, specific example</li>
     <li><input type="checkbox"> Fun title + strong ending</li>
     <li><input type="checkbox"> Read it over for capitals, periods, spelling</li>
   </ul>
   <button class="backbtn" id="back2">\u2039 Back to prompts</button>
  </div>`;
 const clk=document.getElementById("clk"),tg=document.getElementById("toggle");
 function tick(){secs++;clk.textContent=fmt(secs);}
 tg.onclick=()=>{ if(timer){clearInterval(timer);timer=null;tg.textContent="Resume";}
   else {timer=setInterval(tick,1000);tg.textContent="Pause";} };
 const back=()=>{ if(timer){clearInterval(timer);timer=null;} mode="practice"; render(); };
 document.getElementById("back").onclick=back;
 document.getElementById("back2").onclick=back;
}

function render(){
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.m===mode));
 if(mode==="learn")main.innerHTML=learn();
 else if(mode==="routine")main.innerHTML=routine();
 else if(mode==="examples")main.innerHTML=examples();
 else { main.innerHTML=practiceList();
   main.querySelectorAll(".promptcard button").forEach(b=>b.onclick=()=>practiceOne(+b.dataset.i)); }
 main.scrollTop=0;
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ if(timer){clearInterval(timer);timer=null;} mode=t.dataset.m; render(); });
render();
</script></body></html>
